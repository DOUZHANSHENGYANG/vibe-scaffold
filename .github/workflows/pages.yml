name: Pages

# Deploys the Studio and the documentation site to GitHub Pages at
# /vibe-scaffold/. Requires Pages enabled with the "GitHub Actions" source
# (Settings → Pages), which only the repository owner can set once.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true
      - run: vp install
      # The Studio build died twice on hosted runners mid-transform with a
      # SIGTERM the runner reported as a shutdown; retry rides it out and a
      # smaller JS heap leaves more of the machine to rolldown's native side.
      - uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_on: error
          timeout_minutes: 20
          command: vp build apps/web
        env:
          PAGES_BASE: /vibe-scaffold/
          NODE_OPTIONS: --max-old-space-size=4096
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
